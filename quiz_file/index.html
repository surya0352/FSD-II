
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FSD Quiz</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="index.css">

</head>


<body>

    <div class="quiz-container">

        <!-- Quiz Heading -->
        <h1>Welcome To FSD Quiz</h1>

        <p class="welcome">
            Good luck for your quiz! Attempt the quiz carefully.
        </p>


        <!-- Quiz Section -->
        <div id="quiz">

            <!-- Question Number -->
            <h3 id="questionNumber">
                Question 1 of 10
            </h3>


            <!-- Timer -->
            <div class="timer">

                ⏱️ Time Left:

                <span id="time">
                    10
                </span>

                seconds

            </div>


            <!-- Question -->
            <p id="question">
                Question will appear here
            </p>


            <!-- Options -->
            <div id="options">

                <!-- Options will be added by JavaScript -->

            </div>


            <!-- Next Button -->
            <button id="nextButton">

                Next Question

            </button>

        </div>


        <!-- Result Section -->
        <div id="result">

            <!-- Result will be displayed here -->

        </div>

    </div>


    <!-- JavaScript File -->
    <script src="index.js"></script>

</body>

</html>
